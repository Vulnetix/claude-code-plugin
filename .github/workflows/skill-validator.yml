name: Validate Skills
on:
  pull_request:
    paths:
      - "vulnetix/skills/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/skill-validator.yml"

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - uses: actions/checkout@v5
      - name: Install skill-validator
        run: brew install agent-ecosystem/tap/skill-validator
      - name: Validate skills
        run: |
          skill-validator check --strict --allow-dirs=evals --emit-annotations vulnetix/skills/
          skill-validator check --strict --allow-dirs=evals -o markdown vulnetix/skills/ >> "$GITHUB_STEP_SUMMARY"
