<!doctype html>
<html lang="en-GB">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  {{ if .IsHome }}
    <main class="home">{{ block "main" . }}{{ end }}</main>
  {{ else }}
    <div class="page-shell">
      {{ partial "sidebar.html" . }}
      <div class="content-wrap">
        {{ block "main" . }}{{ end }}
      </div>
    </div>
  {{ end }}
  {{ partial "footer.html" . }}
</body>
</html>
