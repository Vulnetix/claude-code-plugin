baseURL = "https://ai-docs.vulnetix.com/"
languageCode = "en-gb"
title = "Vulnetix AI Coding Agent Plugin"

[services]
  [services.googleAnalytics]
    ID = "G-NWBJE5RS0Q"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style       = "monokai"
  lineNos     = false
  codeFences  = true
  guessSyntax = true
  noClasses   = true

[[menu.main]]
  name    = "Docs"
  pageRef = "/docs"
  weight  = 1

[[menu.main]]
  name   = "CLI"
  url    = "https://docs.cli.vulnetix.com"
  weight = 2

[[menu.main]]
  name   = "API"
  url    = "https://redocly.github.io/redoc/?url=https://api.vdb.vulnetix.com/v1/spec"
  weight = 3

[[menu.main]]
  name   = "GitHub"
  url    = "https://github.com/Vulnetix/pix-ai-coding-assistant"
  weight = 4

[params]
  description = "Vulnerability intelligence for Claude Code and other AI coding agents — scans dependencies on commit, searches packages for risk data, analyses exploits and proposes fixes via the Vulnetix VDB API."
  images = ["/assets/vulnetix-og-square.png"]
